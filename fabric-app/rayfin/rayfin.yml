id: mimamoritai-admin
name: mimamoritai-admin
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    password:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://fleet-hill-7d5088b730-westus2.webapp.fabricapps.net
  data:
    enabled: true
    dialect: mssql
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
  storage:
    enabled: false
  functions:
    # Left off: the Fabric backend rejects the settings sync with "Functions are
    # not supported yet" on this capacity, so the console's question box calls the
    # watch app's own /api/console/ask instead. Flip this back on once Fabric
    # accepts user data functions and the answer can be assembled inside Fabric.
    enabled: false
    buildCommand: npm run build
